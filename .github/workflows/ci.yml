name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Start socket server
        env:
          HOST: 127.0.0.1
        run: npx --no-install tsx server/socket.ts &
      - name: Wait for socket port
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if node -e "const n=require('net');const s=n.connect(43128,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))" 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "socket server did not listen on 43128" >&2
          exit 1
      - run: npm run smoke:rooms
