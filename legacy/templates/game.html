<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game</title>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
</head>
<body>
    <h1>Game</h1>
    <div id="status"></div>
    <div id="question"></div>
    <form id="answerForm">
        <input type="number" id="answer" required>
        <button type="submit">Submit</button>
    </form>
    <script>
        var socket = io();
        var room = 'room_' + Math.random().toString(36).substring(2, 15);
        socket.emit('join', { room: room });

        socket.on('status', function(data) {
            document.getElementById('status').innerHTML = data.msg;
        });

        socket.on('question', function(data) {
            document.getElementById('question').innerHTML = data.question_text;
        });

        socket.on('time_up', function(data) {
            alert(data.msg);
        });

        socket.on('result', function(data) {
            alert('Correct Answer: ' + data.correct_answer + '\nYour Points: ' + data.points);
        });

        document.getElementById('answerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var answer = document.getElementById('answer').value;
            socket.emit('submit_answer', { room: room, answer: answer });
        });
    </script>
</body>
</html>
